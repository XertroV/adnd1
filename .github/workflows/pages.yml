name: Publish GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Calibration fixtures verify the original failing catalog/image Git objects.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify reference data and scan integrity
        run: node --test tests/*.test.mjs
      - name: Verify committed static output is current
        run: |
          node tools/assemble.mjs
          git diff --exit-code -- dist
      - name: Generate citation systemic inventory
        if: always()
        run: |
          set +e
          node tools/citation-systemic-inventory.mjs --output-dir artifacts/citation-systemic-coverage
          report_status=$?
          set -e
          if [ -f artifacts/citation-systemic-coverage/citation-systemic-summary.md ]; then
            sed -n '1,35p' artifacts/citation-systemic-coverage/citation-systemic-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p artifacts/citation-systemic-coverage
            echo "Citation systemic inventory unavailable: generator exited before writing its summary (status ${report_status})." >> "$GITHUB_STEP_SUMMARY"
            echo "Generator did not write citation-systemic-summary.md (exit status ${report_status})." > artifacts/citation-systemic-coverage/generation-error.txt
            if [ "$report_status" -eq 0 ]; then report_status=1; fi
          fi
          exit "$report_status"
      - name: Upload citation systemic inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: citation-systemic-inventory
          overwrite: true
          path: artifacts/citation-systemic-coverage/
          if-no-files-found: warn
      - name: Generate source visual coverage
        if: always()
        run: |
          set +e
          node tools/source-visual-coverage.mjs artifacts/source-visual-coverage
          visual_status=$?
          set -e
          if [ -f artifacts/source-visual-coverage/report.md ]; then
            sed -n '1,35p' artifacts/source-visual-coverage/report.md >> "$GITHUB_STEP_SUMMARY"
            echo "Full binding-level JSON and Markdown are available in the source-visual-coverage artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            mkdir -p artifacts/source-visual-coverage
            echo "Source visual coverage unavailable: generator exited before writing its report (status ${visual_status})." >> "$GITHUB_STEP_SUMMARY"
            echo "Generator did not write report.md (exit status ${visual_status})." > artifacts/source-visual-coverage/generation-error.txt
            if [ "$visual_status" -eq 0 ]; then visual_status=1; fi
          fi
          exit "$visual_status"
      - name: Upload source visual coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-visual-coverage
          overwrite: true
          path: artifacts/source-visual-coverage/
          if-no-files-found: warn
      - name: Capture build metadata
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: node tools/stamp-build.mjs --capture
      - name: Save verified app for deployment
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-app
          overwrite: true
          path: |
            dist/
            tools/stamp-build.mjs
            tools/allocate-version.mjs
            tools/build-metadata.json
          if-no-files-found: error


  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Reserve the next number on the dedicated version-state branch.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-app
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reserve deployment version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/allocate-version.mjs
      - name: Stamp build details into deploy artifact
        env:
          DEPLOYMENT_VERSION: ${{ steps.version.outputs.version }}
        run: node tools/stamp-build.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static app only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

